<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>看板娘</title>
<!--LINES-->
<style>
  :root { --ink: #6b3a46; --paper: #fff8fa; --accent: #f08aa4; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 20% 10%, #fde7ee 0, #f4eaf7 45%, #e7eefb 100%);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: var(--ink); overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .hint { position: fixed; left: 20px; top: 16px; max-width: 400px; line-height: 1.7; font-size: 13px; z-index: 2;
    background: rgba(255, 250, 252, .78); border: 1px solid #f3c6d3; border-radius: 14px; padding: 10px 14px;
    box-shadow: 0 4px 14px rgba(170, 80, 110, .12); backdrop-filter: blur(4px); }
  .hint b { color: #c2577a; }
  .stage { position: fixed; touch-action: none; }
  .stage canvas { width: 100%; height: 100%; display: block; }
  /* 畫布的長寬比由 main.ts 依 rig.json 設定；圖被切掉的邊多補了一圈（bleed），那一圈放到畫面外面 */
  #stage-pink { --h: min(98vh, 820px); z-index: 3; right: 0; height: var(--h);
    bottom: calc(var(--h) * var(--bleed-bottom, 0) * -1); }
  #stage-maid { --h: min(58vh, 480px); z-index: 2; height: var(--h);
    left: calc(var(--h) * var(--bleed-left, 0) * -1); bottom: calc(var(--h) * var(--bleed-bottom, 0) * -1); }
  #bubble-pink {
    position: fixed; right: 16px; bottom: 72px; max-width: 260px; min-height: 22px;
    background: var(--paper); border: 2px solid #f3b7c7; border-radius: 16px; padding: 10px 14px;
    font-size: 15px; line-height: 1.5; box-shadow: 0 6px 18px rgba(170, 80, 110, .18);
    opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; pointer-events: none; z-index: 5;
  }
  #bubble-pink.show { opacity: 1; transform: none; }
  /* 女僕的對話框是原圖那種想法泡泡 */
  #bubble-maid {
    position: absolute; left: 74%; top: 2%; width: max-content; max-width: 210px; min-height: 22px;
    background: #fff; border: 3px solid #26386c; border-radius: 50%; padding: 16px 22px;
    font-size: 14px; line-height: 1.5; color: #26386c; text-align: center;
    opacity: 0; transform: translateY(8px) scale(.96); transition: opacity .25s, transform .25s; pointer-events: none; z-index: 5;
  }
  #bubble-maid::before, #bubble-maid::after { content: ''; position: absolute; background: #fff; border: 3px solid #26386c; border-radius: 50%; }
  #bubble-maid::before { width: 14px; height: 11px; left: 6px; bottom: -16px; }
  #bubble-maid::after { width: 8px; height: 7px; left: -6px; bottom: -28px; }
  #bubble-maid.show { opacity: 1; transform: none; }
  #mic {
    position: fixed; right: 16px; top: 14px; z-index: 6;
    border: 2px solid #f3b7c7; background: #fff; color: var(--ink); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #bgbtn { position: fixed; right: 16px; top: 52px; z-index: 6; border: 2px solid #f3b7c7; background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  #gear { position: fixed; right: 16px; top: 90px; z-index: 6; border: 2px solid #f3b7c7; background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  #settings { position: fixed; right: 16px; top: 130px; z-index: 7; width: 270px; display: none; flex-direction: column; gap: 10px;
    background: #fff; border: 2px solid #f3b7c7; border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 6px 18px rgba(170, 80, 110, .18); }
  #settings.open { display: flex; }
  #settings label { display: flex; flex-direction: column; gap: 4px; }
  #settings .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  #settings input[type=text], #settings #name-input { flex: 1; min-width: 0; border: 1px solid #f0c3d0; border-radius: 8px; padding: 4px 8px; font: inherit; }
  #settings button { border: 1px solid #f0c3d0; background: #fff6f9; color: var(--ink); border-radius: 8px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #settings button:disabled { opacity: .45; cursor: default; }
  #settings-close { border: none !important; background: none !important; }
  #settings .field { display: flex; flex-direction: column; gap: 4px; }
  #settings .pick { display: inline-block; border: 1px solid #f0c3d0; background: #fff6f9; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  #bg-file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9a6a7c; font-size: 12px; }
  #settings { max-height: calc(100vh - 150px); overflow-y: auto; }
  #settings hr { border: none; border-top: 1px dashed #f0c3d0; margin: 2px 0; width: 100%; }
  #settings input:not([type=file]), #settings select { border: 1px solid #f0c3d0; border-radius: 8px; padding: 4px 8px; font: inherit; background: #fff; }
  #settings .note { margin: 0; color: #9a6a7c; font-size: 12px; word-break: break-all; }
  #chat { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 6; display: flex; gap: 6px;
    width: min(520px, calc(100vw - 32px)); background: rgba(255, 255, 255, .88); border: 2px solid #f3b7c7; border-radius: 999px;
    padding: 5px 6px 5px 10px; box-shadow: 0 6px 18px rgba(170, 80, 110, .16); backdrop-filter: blur(4px); }
  #chat select, #chat input { border: none; background: transparent; font: inherit; font-size: 14px; color: var(--ink); outline: none; }
  #chat input { flex: 1; min-width: 0; }
  #chat button { border: none; background: var(--accent); color: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  #settings-note { margin: 0; color: #9a6a7c; font-size: 12px; }
  #mic.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (max-width: 600px) {
    .hint { display: none; } #mic { top: 10px; } #bgbtn { top: 46px; } #gear { top: 82px; } #settings { top: 120px; right: 10px; }
    /* 手機太窄放不下兩個人並排：主角往右挪一點，女僕縮小疊在前面 */
    #stage-pink { --h: 62vh; right: -80px; }
    #stage-maid { --h: 32vh; z-index: 4; }
    #bubble-maid { left: 52%; top: -26%; max-width: 150px; font-size: 13px; padding: 10px 14px; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="hint">
  <b>看板娘</b>：兩個人的眼睛和頭都會跟著滑鼠轉。<br />
  戳<b>頭</b>會害羞，戳<b>臉頰</b>會鼓起來，另一個會轉頭看，<br />
  滑鼠太久不動她們會<b>打瞌睡</b>（女僕比較愛睏），偶爾兩個人會聊天。<br />
  按「🎤 對嘴」她們會跟著你的聲音張嘴。<br />
  右上角「🖼 背景」可以換背景，房間圖會跟著現在時間變白天／黃昏／晚上；「⚙ 設定」可以讓她們叫你的名字、上傳自己的背景圖、接上 AI 後用下面的聊天框跟她們聊天。<br>
  網址加上 <code>?debug=1</code> 可以看網格線、自己拉參數。
</div>
<div class="stage" id="stage-maid"><canvas></canvas><div id="bubble-maid"></div></div>
<div class="stage" id="stage-pink"><canvas></canvas></div>
<button id="mic" title="讓她們的嘴巴跟著你的聲音動">🎤 對嘴</button>
<button id="gear" title="設定：名字、上傳自己的背景">⚙ 設定</button>
<div id="settings">
  <div class="row"><b>設定</b><button id="settings-close" title="關閉">✕</button></div>
  <label>她們怎麼叫你
    <span class="row"><input id="name-input" maxlength="20" placeholder="輸入你的名字（空白＝你／主人）" /><button id="name-save">記住</button></span>
  </label>
  <div class="field">上傳自己的背景圖
    <span class="row"><label class="pick" for="bg-file">選擇圖片…</label><span id="bg-file-name">還沒選</span></span>
    <input id="bg-file" type="file" accept="image/*" hidden />
  </div>
  <button id="bg-clear">刪掉自訂背景</button>
  <hr />
  <b>AI 聊天</b>
  <label>用哪個 AI<select id="ai-preset"></select></label>
  <label>網址<input id="ai-url" spellcheck="false" /></label>
  <label>模型名稱<input id="ai-model" spellcheck="false" placeholder="例如 qwen2.5:7b" /></label>
  <label>API 金鑰（本機模型不用填）<input id="ai-key" type="password" spellcheck="false" autocomplete="off" /></label>
  <span class="row"><button id="ai-save">儲存</button><button id="ai-test">測試連線</button><button id="ai-clear">刪除</button></span>
  <p id="ai-note" class="note">金鑰只存在這個瀏覽器，只會送到你選的 AI。不要在別人的電腦上存金鑰。</p>
  <p id="settings-note">名字和背景只存在這台電腦的瀏覽器裡，不會上傳到任何地方。</p>
</div>
<button id="bgbtn" title="切換背景（圖片房間會跟著現在的時間變白天／黃昏／晚上）">🖼 背景</button>
<div id="bubble-pink"></div>
<form id="chat" autocomplete="off">
  <select id="chat-who" title="跟誰說話"><option value="pink">粉紅</option><option value="maid">女僕</option><option value="both">兩個人</option></select>
  <input id="chat-input" maxlength="200" placeholder="跟她們說說話……（要先在設定接上 AI）" />
  <button type="submit">送出</button>
</form>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
